<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Pjt CRUD do Gabriel 零</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <nav>
            <header class="AVANT">
                <span>AVANT MUSIC</span>
            </header>
            
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="index.html" class="nav-link active">Cadastrar Música</a>
            <a href="biblioteca.html" class="nav-link">Biblioteca</a>

            <footer>
                Sistema du marsali 零 v1.3<br>
            </footer>
        </nav>
        
        <main>
            <div id="cadastro-content" class="content-section">
                <h2 id="form-title" class="CNM">Cadastrar Nova Música</h2>
                
                <form id="cadastroMusicaForm" novalidate>
                    <input type="hidden" id="edit-index" value="">

                    <div class="section">
                        <div class="grid-2">
                            <label for="nomeMusica">Nome da Música <span class="required">*</span>
                                <input type="text" id="nomeMusica" placeholder="Ex: Ego" required>
                            </label>

                            <label for="artista">Artista / Banda <span class="required">*</span>
                                <input type="text" id="artista" placeholder="Ex: NIKK" required>
                            </label>
                        </div>
                        
                        <div class="grid-2" style="margin-top: 15px;">
                            <label for="dataLancamento">Data de Lançamento <span class="required">*</span>
                                <input type="date" id="dataLancamento" required>
                            </label>

                            <label for="generoMusical">Gênero Musical
                                <select id="generoMusical">
                                    <option value="" selected disabled>Selecione o gênero</option>
                                    <option value="Pop">Pop</option>
                                    <option value="Rock">Rock</option>
                                    <option value="Rap">Rap / Trap</option>
                                    <option value="Sertanejo">Sertanejo</option>
                                    <option value="Eletrônica">Eletrônica</option>
                                    <option value="Outro">Outro</option>
                                </select>
                            </label>
                        </div>
                    </div>

                    <fieldset class="section">
                        <legend>Detalhes da Faixa</legend>
                        <small class="description">Informações adicionais opcionais</small>
                        <div class="grid-2">
                            <label for="album">Álbum / EP
                                <input type="text" id="album" placeholder="Ex: FACES">
                            </label>
                            
                            <label for="duracao">Duração
                                <input type="text" id="duracao" placeholder="Ex: 02:21">
                            </label>
                        </div>
                    </fieldset>

                    <div class="form-buttons">
                        <button type="submit" id="btn-submit">Salvar na Biblioteca</button>
                        <button type="button" id="btn-cancel" style="display: none;">Cancelar Edição</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
